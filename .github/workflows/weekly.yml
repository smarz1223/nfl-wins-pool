name: Weekly NFL Wins Pool data refresh

on:
  schedule:
    # Every day at 11:07 UTC (7:07 AM ET / 6:07 AM EST) - offset off :00 to avoid GitHub's peak cron congestion
    - cron: '7 11 * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch sheet and rebuild data.json
        run: python fetch_data.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json weekly_snapshots.json
          git diff --cached --quiet || git commit -m "Weekly data refresh"
          git push
